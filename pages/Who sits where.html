<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Who sits where</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root {
  color-scheme: light;
  --bg: #e6edf1;
  --panel: #ffffff;
  --ink: #14213d;
  --muted: #5b6b82;
  --line: #c5d1db;
  --accent: #f2b705;
  --accent-ink: #14213d;
  --seat: #eef3f6;
  --warn: #b3261e;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f1726;
    --panel: #18233a;
    --ink: #eaf0f7;
    --muted: #9fb0c6;
    --line: #2e3d59;
    --seat: #1f2d48;
    --warn: #ff8a80;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1726;
  --panel: #18233a;
  --ink: #eaf0f7;
  --muted: #9fb0c6;
  --line: #2e3d59;
  --seat: #1f2d48;
  --warn: #ff8a80;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height: 1.45;
}
main { max-width: 980px; margin: 0 auto; padding: 28px 18px 48px; }
h1 { font-size: clamp(2rem, 6vw, 3.4rem); font-weight: 800; letter-spacing: -0.03em; margin: 0 0 6px; line-height: 1; }
.sub { color: var(--muted); margin: 0 0 24px; }
.setup { display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
@media (max-width: 680px) { .setup { grid-template-columns: 1fr; } }
.panel { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 16px; }
label { display: block; font-weight: 600; margin-bottom: 6px; }
.hint { color: var(--muted); font-size: .88rem; margin: 6px 0 0; }
textarea, input[type="text"] {
  width: 100%; font: inherit; color: var(--ink); background: var(--seat);
  border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
textarea { min-height: 220px; resize: vertical; }
textarea:focus-visible, input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.go {
  font: inherit; font-weight: 800; font-size: 1.15rem; cursor: pointer;
  background: var(--accent); color: var(--accent-ink);
  border: 0; border-radius: 12px; padding: 14px 18px; width: 100%;
  box-shadow: 0 4px 0 rgba(0,0,0,.25);
  transition: transform .08s, box-shadow .08s;
}
.go:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.25); }
.summary { margin: 22px 0 10px; font-weight: 600; }
.summary.bad { color: var(--warn); }
.road {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px;
}
.car {
  background: var(--panel); border: 2px solid var(--line); border-radius: 26px 26px 14px 14px;
  padding: 0 14px 14px; position: relative; overflow: hidden;
}
.car::before { /* roof stripe in the car colour */
  content: ""; display: block; height: 14px; margin: 0 -14px 12px; background: var(--car);
}
.car h2 { margin: 0; font-size: 1.25rem; font-weight: 800; display: flex; justify-content: space-between; align-items: baseline; }
.car h2 span { font-size: .9rem; font-weight: 600; color: var(--muted); }
.front { font-size: .8rem; color: var(--muted); margin: 8px 0 6px; }
.seats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seat {
  min-height: 46px; border-radius: 10px; padding: 8px 10px; font-weight: 600;
  background: var(--seat); border: 2px dashed var(--line); color: var(--muted);
  display: flex; align-items: center; overflow-wrap: anywhere;
}
.seat.filled { border: 2px solid var(--car); color: var(--ink); background: var(--panel); box-shadow: inset 5px 0 0 var(--car); padding-left: 14px; animation: pop .35s both; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.9); } to { opacity: 1; transform: none; } }
.left { margin-top: 18px; }
.left .chip { display: inline-block; margin: 4px 6px 0 0; padding: 6px 12px; border-radius: 999px; border: 2px solid var(--warn); color: var(--warn); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .seat.filled { animation: none; } .go { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Who sits where</h1>
  <p class="sub">Add the names, set how many seats each car has, and let chance decide.</p>

  <section class="setup">
    <div class="panel">
      <label for="names">Names (one per line)</label>
      <textarea id="names">Satva
Kaala
anmol
dabba
soru
amaan
vedant
abbas
manas ji</textarea>
    </div>
    <div class="stack">
      <div class="panel">
        <label for="caps">Seats in each car</label>
        <input type="text" id="caps" value="5, 6" inputmode="numeric" autocomplete="off">
        <p class="hint">Separate with commas. “5, 6” makes two cars, “4, 4, 4” makes three.</p>
      </div>
      <button class="go" id="go" type="button">Allocate seats</button>
    </div>
  </section>

  <div class="summary" id="summary" aria-live="polite"></div>
  <section class="road" id="road"></section>
  <div class="left" id="left"></div>
</main>

<script>
(function () {
  var COLORS = ['#e4572e', '#2e86ab', '#3a9d5d', '#8e5bd1', '#d4a017', '#d6336c'];
  var namesEl = document.getElementById('names');
  var capsEl = document.getElementById('caps');
  var road = document.getElementById('road');
  var summary = document.getElementById('summary');
  var left = document.getElementById('left');

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function run() {
    var names = namesEl.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    var caps = capsEl.value.split(/[\s,;]+/).map(Number).filter(function (n) { return Number.isInteger(n) && n > 0 && n <= 20; });

    road.innerHTML = '';
    left.innerHTML = '';
    summary.className = 'summary';

    if (!names.length || !caps.length) {
      summary.textContent = 'Add at least one name and one car size (for example 5, 6).';
      summary.className = 'summary bad';
      return;
    }

    var total = caps.reduce(function (a, b) { return a + b; }, 0);
    var order = shuffle(names);
    var groups = caps.map(function () { return []; });
    order.slice(0, total).forEach(function (n) {
      var best = -1;
      caps.forEach(function (cap, i) {
        if (groups[i].length >= cap) return;
        if (best < 0 || groups[i].length < groups[best].length ||
            (groups[i].length === groups[best].length && cap > caps[best])) best = i;
      });
      groups[best].push(n);
    });
    var delay = 0;

    caps.forEach(function (cap, c) {
      var car = el('div', 'car');
      car.style.setProperty('--car', COLORS[c % COLORS.length]);
      var h = el('h2', null, 'Car ' + (c + 1));
      h.appendChild(el('span', null, cap + ' seats'));
      car.appendChild(h);
      car.appendChild(el('div', 'front', 'Front of the car: first two seats'));
      var seats = el('div', 'seats');
      for (var s = 0; s < cap; s++) {
        if (s < groups[c].length) {
          var f = el('div', 'seat filled', groups[c][s]);
          f.style.animationDelay = (delay++ * 140) + 'ms';
          seats.appendChild(f);
        } else {
          seats.appendChild(el('div', 'seat', 'Empty'));
        }
      }
      car.appendChild(seats);
      road.appendChild(car);
    });

    if (order.length > total) {
      var over = order.length - total;
      summary.className = 'summary bad';
      summary.textContent = names.length + ' people, ' + total + ' seats. ' + over + ' without a ride.';
      left.appendChild(el('div', null, 'No seat left for:'));
      order.slice(total).forEach(function (n) { left.appendChild(el('span', 'chip', n)); });
    } else {
      var spare = total - order.length;
      summary.textContent = names.length + ' people in ' + caps.length + ' cars' + (spare ? ', ' + spare + ' spare seat' + (spare > 1 ? 's' : '') : ', every seat taken') + '.';
    }
  }

  document.getElementById('go').addEventListener('click', run);
  run();
})();
</script>
</body>
</html>
