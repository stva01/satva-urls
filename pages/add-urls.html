<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Redirect — satva shah</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --bg: #F6F5F1;
      --ink: #171717;
      --muted: #6B6B63;
      --line: #DDDACC;
      --accent: #2F5D50;
      --accent-soft: #E4EBE7;
      --error: #B3452F;
      --error-soft: #F3E4DF;
      --max: 480px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    ::selection {
      background: var(--accent);
      color: #fff;
    }

    .wrap {
      width: 100%;
      max-width: var(--max);
    }

    .brand {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.02em;
      margin-bottom: 28px;
      text-align: center;
    }

    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 32px 28px;
    }

    .eyebrow {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.6rem;
      letter-spacing: -0.01em;
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 0.92rem;
      color: var(--muted);
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group:last-of-type {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.03em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink);
      outline: none;
      transition: border-color .15s ease, background .15s ease;
    }

    input::placeholder {
      color: #A8A69B;
    }

    input:focus {
      border-color: var(--accent);
      background: #fff;
    }

    .slug-preview {
      margin-top: 8px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12.5px;
      color: var(--muted);
    }

    .slug-preview span {
      color: var(--accent);
    }

    button {
      width: 100%;
      padding: 14px;
      font-family: 'Inter', sans-serif;
      font-size: 0.98rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      transition: opacity .15s ease;
      margin-top: 8px;
    }

    button:hover:not(:disabled) {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status-box {
      margin-top: 20px;
      padding: 13px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      line-height: 1.55;
      display: none;
    }

    .status-box.error {
      display: block;
      background: var(--error-soft);
      border: 1px solid var(--error);
      color: var(--error);
    }

    .status-box.success {
      display: block;
      background: var(--accent-soft);
      border: 1px solid var(--accent);
      color: var(--accent);
    }

    .status-box.loading {
      display: block;
      background: #fff;
      border: 1px solid var(--line);
      color: var(--muted);
    }

    .status-box a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: underline;
    }

    .status-box code {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.85em;
      background: rgba(0, 0, 0, 0.05);
      padding: 1px 5px;
      border-radius: 4px;
    }

    @media (max-width: 420px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 26px 20px;
      }

      h1 {
        font-size: 1.4rem;
      }
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>

<body>

  <div class="wrap">
    <div class="brand">satva shah</div>

    <div class="card">
      <div class="eyebrow">Admin</div>
      <h1>Add redirect</h1>
      <p class="subtitle">Create a short link and set where it should go.</p>

      <form id="redirect-form">
        <div class="form-group">
          <label for="slug">Short slug</label>
          <input type="text" id="slug" name="slug" placeholder="fyp-sem7" required autocomplete="off">
          <div class="slug-preview">satva.dev/<span id="preview-text"></span></div>
        </div>

        <div class="form-group">
          <label for="url">Destination</label>
          <input type="text" id="url" name="url" placeholder="https://... or page.html" required>
        </div>

        <div class="form-group">
          <label for="secret">PIN</label>
          <input type="password" id="secret" name="secret" autocomplete="current-password" required>
        </div>

        <div class="form-group">
          <label for="commit_msg">Note (optional)</label>
          <input type="text" id="commit_msg" name="commit_msg" placeholder="Add redirect: fyp-sem7">
        </div>

        <button type="submit" id="submit-btn">Add redirect</button>
      </form>

      <div id="status" class="status-box"></div>
    </div>
  </div>

  <script>
    const form = document.getElementById('redirect-form');
    const slugInput = document.getElementById('slug');
    const urlInput = document.getElementById('url');
    const secretInput = document.getElementById('secret');
    const commitMsgInput = document.getElementById('commit_msg');
    const submitBtn = document.getElementById('submit-btn');
    const statusBox = document.getElementById('status');
    const previewText = document.getElementById('preview-text');

    const savedSecret = localStorage.getItem('satva_admin_secret');
    if (savedSecret) {
      secretInput.value = savedSecret;
    }

    slugInput.addEventListener('input', () => {
      const cleanSlug = slugInput.value.trim().replace(/^\/+|\/+$/g, '').toLowerCase();
      previewText.textContent = cleanSlug;
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const slug = slugInput.value.trim().replace(/^\/+|\/+$/g, '').toLowerCase();
      const url = urlInput.value.trim();
      const secret = secretInput.value.trim();
      const commit_msg = commitMsgInput.value.trim();

      if (!slug || !url) {
        showStatus('Slug and destination are both required.', 'error');
        return;
      }

      if (secret) {
        localStorage.setItem('satva_admin_secret', secret);
      }

      setLoading(true);
      showStatus('Adding redirect…', 'loading');

      try {
        const response = await fetch(window.location.pathname, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slug, url, secret, commit_msg })
        });

        const rawText = await response.text();
        let data = {};
        try {
          data = JSON.parse(rawText);
        } catch (e) {
          data = { error: `Unexpected response (${response.status}): ` + rawText.substring(0, 150) };
        }

        if (response.ok && data.success) {
          showStatus(`
            <strong>Redirect added.</strong> It'll be live shortly — check it here:<br>
            <a href="/${slug}" target="_blank">satva.dev/${slug} &rarr;</a>
          `, 'success');
          slugInput.value = '';
          urlInput.value = '';
          commitMsgInput.value = '';
          previewText.textContent = '';
        } else {
          showStatus(`${data.error || 'Could not add the redirect.'} ${data.details ? '<br><small>' + data.details + '</small>' : ''}`, 'error');
        }
      } catch (err) {
        showStatus(`Network error: ${err.message}`, 'error');
      } finally {
        setLoading(false);
      }
    });

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      submitBtn.textContent = isLoading ? 'Adding…' : 'Add redirect';
    }

    function showStatus(html, type) {
      statusBox.className = `status-box ${type}`;
      statusBox.innerHTML = html;
    }
  </script>

</body>

</html>
