<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>URL Redirects</title><style>:root{--bg:#0d3b78;--line:rgba(255,255,255,.85);--grid:rgba(255,255,255,.07);--card-bg:rgba(255,255,255,.05);--text:rgba(255,255,255,.9);--accent:#64b5f6}*{box-sizing:border-box}body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.6}header{text-align:center;padding:48px 20px 32px;border-bottom:2px solid var(--line)}header h1{margin:0 0 8px;font-size:2.2rem;font-weight:700;letter-spacing:-.02em}header p{margin:0;font-size:.95rem;opacity:.9}.wrap{max-width:1000px;margin:0 auto;padding:48px 20px 80px}.count{text-align:center;margin-bottom:32px;font-size:.95rem;opacity:.8}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}.card{background:var(--card-bg);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:14px;transition:all .2s ease}.card:hover{background:rgba(255,255,255,.08);border-color:var(--accent)}.slug{font-size:1.05rem;font-weight:600;color:var(--accent);word-break:break-word;font-family:monospace;letter-spacing:.02em}.destination{font-size:.85rem;opacity:.75;word-break:break-word;max-height:60px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-family:monospace}.link-btn{margin-top:auto;padding:10px 14px;background:rgba(100,181,246,.15);border:1px solid var(--accent);border-radius:4px;color:var(--accent);text-decoration:none;text-align:center;font-size:.85rem;font-weight:600;transition:all .2s ease;cursor:pointer}.link-btn:hover{background:rgba(100,181,246,.25);transform:translateY(-1px)}.footer{text-align:center;padding:40px 20px;opacity:.7;font-size:.9rem}@media(max-width:768px){header h1{font-size:1.8rem}.wrap{padding:32px 16px 60px}.grid{grid-template-columns:1fr}}</style></head><body><header><h1>URL Redirects</h1><p>Quick links to resources</p></header><div class="wrap"><div class="count" id="count"></div><div class="grid" id="grid"></div></div><div class="footer"><p>satva.dev — short URLs</p></div><script>async function loadRedirects(){try{const response=await fetch('/redirects.json');const redirects=await response.json();const grid=document.getElementById('grid');const count=document.getElementById('count');const sortedSlugs=Object.keys(redirects).sort();count.textContent=`${sortedSlugs.length} links`;sortedSlugs.forEach(slug=>{const url=redirects[slug];const card=document.createElement('div');card.className='card';const slugEl=document.createElement('div');slugEl.className='slug';slugEl.textContent=slug;const destEl=document.createElement('div');destEl.className='destination';destEl.textContent=url;const linkEl=document.createElement('a');linkEl.className='link-btn';linkEl.href=`/${slug}`;linkEl.target='_blank';linkEl.textContent='Open link →';card.appendChild(slugEl);card.appendChild(destEl);card.appendChild(linkEl);grid.appendChild(card);})}catch(err){console.error('Failed to load redirects:',err);document.getElementById('grid').innerHTML='<p>Failed to load redirects.</p>}}loadRedirects();</script></body></html>
